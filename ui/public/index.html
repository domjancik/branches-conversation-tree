<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branches Conversation Tree</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Branches Conversation Tree Visualizer</h1>
            <div class="controls">
                <select id="rootSelector">
                    <option value="">Select Root...</option>
                </select>
                <button id="resetZoom">Reset View</button>
                <button id="expandAll">Expand All</button>
                <button id="collapseAll">Collapse All</button>
            </div>
        </header>
        
        <main>
            <div id="container">
                <div id="tree-visualization"></div>
                <div id="details-panel">
                    <div id="node-details">
                        <h3>Select a node to view details</h3>
                    </div>
                    <div id="images-section">
                        <h3>Generated Images</h3>
                        <div id="images-container"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
