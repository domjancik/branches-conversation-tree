<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branches Conversation Tree</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Branches Conversation Tree Visualizer</h1>
        <div class="controls">
            <button id="resetZoom">Reset Zoom</button>
            <button id="expandAll">Expand All</button>
            <button id="collapseAll">Collapse All</button>
            <button id="layoutToggle">Horizontal Layout</button>
            <select id="rootSelector">
                <option value="">Select Root...</option>
            </select>
            <a href="/graph.html" style="background:#34495e;color:white;padding:0.5rem 0.75rem;border-radius:4px;text-decoration:none">Graph View</a>
        </div>
        </header>
        
        <main>
            <div id="container">
                <div id="tree-visualization"></div>
                <div id="details-panel">
                    <div id="node-details">
                        <h3>Select a node to view details</h3>
                    </div>
                    <div id="audio-section">
                        <h3>Audio Recording</h3>
                        <div id="audio-container">
                            <p id="audio-placeholder" style="color: #777; font-style: italic;">No audio selected</p>
                            <audio id="audio-player" controls style="display: none; width: 100%; margin-top: 0.5rem;">
                                <source type="audio/wav">
                                <source type="audio/mpeg">
                                <source type="audio/mp3">
                                Your browser does not support the audio element.
                            </audio>
                        </div>
                    </div>
                </div>
                <div id="images-panel">
                    <div id="images-section">
                        <h3>Generated Images</h3>
                        <div id="images-container"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
