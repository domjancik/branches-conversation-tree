<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio -> Whisper -> Categorize & Relate</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Audio -> Whisper -> Categorize & Relate</h1>
      <div class="controls">
        <button id="startBtn">Start Recording</button>
        <button id="stopBtn" disabled>Stop</button>
        <span id="status"></span>
      </div>
      <div class="preview">
        <audio id="player" controls></audio>
      </div>
      <div class="output">
        <h2>Output JSON</h2>
        <pre id="result"></pre>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
